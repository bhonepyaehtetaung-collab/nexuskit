# Netlify builds the Next.js app automatically (OpenNext adapter).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # These two are PUBLIC by design (they ship to the browser; the database is
  # protected by Row Level Security). Real secrets are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"

[functions]
  directory = "netlify/functions"
